version: "3.9"

services:
  postgres:
    image: postgres:latest
    container_name: notification_db
    
    environment:
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification
      POSTGRES_DB: notification_dev
    
    ports:
      - "5450:5432"
    
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notification_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  notification_postgres_data: